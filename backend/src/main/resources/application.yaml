spring:
  application:
    name: gastos-ingresos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:51842}/${DB_NAME:gastosdb}
    username: ${DB_USER:gastos}
    password: ${DB_PASSWORD:gastos123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid, email, profile

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 51841
  # Detras de nginx (Docker) el redirect_uri de OAuth2 se arma con los headers X-Forwarded-*.
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-it-before-prod-32b}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:51840/auth/callback}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:51840}
  iol:
    base-url: ${IOL_BASE_URL:https://api.invertironline.com}

logging:
  level:
    com.nicolas.finanzas.iol: INFO
