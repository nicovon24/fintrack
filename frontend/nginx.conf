# Puerto por el que el navegador ve la app (el publicado por Docker, no el interno de nginx).
# Spring lo usa para armar el redirect_uri de OAuth2, que debe coincidir con el registrado en Google.
#
# Si el Host trae puerto explicito (localhost:51840) se usa ese. Si no lo trae, el navegador
# entro por el puerto default del esquema: 443 con https, 80 con http. Poner un puerto fijo
# como default romperia cualquier deploy detras de un dominio sin puerto en la URL.
map $http_host $host_port {
    default              "";
    "~^[^:]+:(?<p>\d+)$" $p;
}

map $scheme $default_port {
    default "80";
    https   "443";
}

map $host_port $public_port {
    default  $host_port;
    ""       $default_port;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API va por el mismo origen: nginx redirige /api al backend.
    location /api/ {
        proxy_pass http://backend:51841;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $public_port;
    }

    # Login con Google: el flujo OAuth2 lo maneja Spring Security.
    location /oauth2/ {
        proxy_pass http://backend:51841;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $public_port;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:51841;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $public_port;
    }

    # Angular es una SPA: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
